# Pull requests that keep the pinned actions and the Rust dependencies up to
# date, once a week; each is reviewed like any other change. Each commit
# message, and so each pull request's title, starts with one of the types
# in CONTRIBUTING.md (How changes land): `ci` for the actions, `build` for
# the crates.
#
# The updates that should break nothing come in one pull request for each
# ecosystem, so CI runs once for them and not once for each; an update that
# may break something keeps a pull request of its own, to be read alone
# (GitHub docs, Dependabot options reference, `groups`). Dependabot reads
# every version as major.minor.patch. For the actions the group is the
# minor and the patch releases. For the crates it is the patch releases
# alone: to Cargo 0.48 is not compatible with 0.47 (The Cargo Book,
# Specifying Dependencies, Default requirements). A group holds version
# updates only, so a security update keeps a pull request of its own too.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      crates:
        patterns: ["*"]
        update-types: [patch]
    # skrifa stays at 0.47, and only its patch releases are proposed.
    # skrifa 0.50 brings eight crates archgram does not have, one of them,
    # foldhash, under the Zlib licence, which deny.toml does not allow;
    # archgram reads only the four fonts it ships, and no advisory names
    # 0.47. An ignored update is not opened as a security update either
    # (GitHub docs, Controlling which dependencies are updated by
    # Dependabot), so advisories.yml is what says when 0.47 gets one.
    ignore:
      - dependency-name: skrifa
        update-types: ["version-update:semver-minor"]
