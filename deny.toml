# What a dependency may be (ARCHITECTURE.md, Dependencies and supply
# chain), checked by cargo-deny in CI (ci.yml, advisories.yml).

[licenses]
# We want really high confidence when inferring licenses from text
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "MIT",
  # unicode-ident
  "Unicode-3.0",
  # archgram-icons: Simple Icons' logo data
  "CC0-1.0",
  # archgram-core: the embedded Geist fonts
  "OFL-1.1",
]
# resvg's tree, for the still preview (docs/features/reader-check.md, #173),
# approved by the owner on 2026-11-19 for these crates alone, so another
# crate under the same licence is still refused until it is approved.
exceptions = [
  { crate = "tiny-skia", allow = ["BSD-3-Clause"] },
  { crate = "tiny-skia-path", allow = ["BSD-3-Clause"] },
  { crate = "arrayref", allow = ["BSD-2-Clause"] },
  { crate = "foldhash", allow = ["Zlib"] },
  { crate = "slotmap", allow = ["Zlib"] },
  # Every Simple Icons logo, whatever its licence: the owner's decision on
  # 2026-11-20 (#176), for this crate alone. Each logo's licence is in
  # crates/archgram-icons/data/provenance.tsv.
  { crate = "archgram-icons", allow = [
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "BSD-3-Clause",
    "CC-BY-2.5",
    "CC-BY-3.0",
    "CC-BY-4.0",
    "CC-BY-NC-4.0",
    "CC-BY-NC-ND-4.0",
    "CC-BY-NC-SA-3.0",
    "CC-BY-NC-SA-4.0",
    "CC-BY-ND-4.0",
    "CC-BY-SA-2.0",
    "CC-BY-SA-2.5",
    "CC-BY-SA-3.0",
    "CC-BY-SA-4.0",
    "GPL-2.0-only",
    "GPL-2.0-or-later",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "LicenseRef-SimpleIcons-Custom",
    "MPL-2.0",
    "Unlicense",
  ] },
]

# Every version in Cargo.lock against the RustSec advisory database,
# cargo-deny's default. Any vulnerability fails. An unmaintained crate
# fails too, set here rather than left to the default, so a new version
# of cargo-deny cannot change it; one that cannot be replaced goes in
# `ignore`, with a `reason`.
[advisories]
unmaintained = "all"

# Every package outside the workspace comes from crates.io, the only
# registry allowed by default; any other registry or git source fails.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
