    <rect class="badge" x="242.5" y="34.5" width="36" height="36" rx="8"/>
    <g class="icon core" transform="translate(248.5 40.5)" stroke-width="1.7"><path d="M2.5 12c0-4.48 0-6.72 1.39-8.11C5.28 2.5 7.52 2.5 12 2.5c4.48 0 6.72 0 8.11 1.39C21.5 5.28 21.5 7.52 21.5 12c0 4.48 0 6.72-1.39 8.11C18.72 21.5 16.48 21.5 12 21.5c-4.48 0-6.72 0-8.11-1.39C2.5 18.72 2.5 16.48 2.5 12z"/><path d="M9.5 9.5L7.97 10.82C7.32 11.38 7 11.65 7 12c0 .35.32.62.97 1.18L9.5 14.5"/><path d="M14.5 9.5l1.53 1.32c.65.56.97.83.97 1.18 0 .35-.32.62-.97 1.18L14.5 14.5"/></g>
