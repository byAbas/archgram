<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 648 457.8" width="648" height="457.8" role="img" aria-labelledby="title desc">
  <title id="title">Sign in</title>
  <desc id="desc">The browser posts the login to the API, which finds the user in Postgres; with the right password the API returns a session, and otherwise refuses with a 401. 1. Browser calls API: POST /login. 2. API calls Users: find user. 3. Users replies to API: user. If password matches: 4. API replies to Browser: session. Otherwise: 5. API replies to Browser: 401, refused.</desc>
  <style>
    :root { --badge: #f1f1f1; --canvas: #fbfbfb; --card: #ffffff; --card-edge: #d4d4d4; --connector: #8f8f8f; --frame: #8f8f8f; --icon-ai: #1f1f1f; --icon-build: #1f1f1f; --icon-client: #1f1f1f; --icon-core: #1f1f1f; --signal-core: #ffffff; --signal-pass: #45a378; --signal-refusal: #880d1e; --text: #1f1f1f; --text-muted: #646464; }
    @media (prefers-color-scheme: dark) { :root { --badge: #252525; --canvas: #111111; --card: #191919; --card-edge: #353535; --connector: #707070; --frame: #707070; --icon-ai: #ededed; --icon-build: #ededed; --icon-client: #ededed; --icon-core: #ededed; --signal-core: #ededed; --signal-pass: #34d399; --signal-refusal: #ea7b8a; --text: #ededed; --text-muted: #a8a8a8; } }
    @font-face { font-family: "archgram-geist"; font-weight: 400; src: url(data:font/ttf;base64,) format("truetype"); }
    @font-face { font-family: "archgram-geist"; font-weight: 500; src: url(data:font/ttf;base64,) format("truetype"); }
    text { font-family: "archgram-geist", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-kerning: none; }
    .title { font-size: 14px; font-weight: 500; fill: var(--text); }
    .sub { font-size: 12px; font-weight: 400; fill: var(--text-muted); }
    .canvas { fill: var(--canvas); }
    .card { fill: var(--card); stroke: var(--card-edge); stroke-width: 1; }
    .card.external { fill: var(--canvas); stroke: var(--connector); stroke-dasharray: 5 4; }
    .badge { fill: var(--badge); }
    .logo { fill: var(--text-muted); }
    .logo-icon.core { fill: var(--icon-core); }
    .logo-icon.ai { fill: var(--icon-ai); }
    .logo-icon.build { fill: var(--icon-build); }
    .logo-icon.client { fill: var(--icon-client); }
    .logo-chip { fill: var(--card); stroke: var(--card-edge); stroke-width: 1; }
    .frame { fill: none; stroke: var(--frame); stroke-width: 1.1; stroke-dasharray: 6 5; }
    .frame-label { font-size: 11px; font-weight: 500; letter-spacing: 0.88px; fill: var(--text-muted); }
    .label-patch { fill: var(--canvas); }
    .edge { fill: none; stroke: var(--connector); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .edge.dashed { stroke-dasharray: 4 4; }
    .arrowhead { fill: none; stroke: var(--connector); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .icon { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .icon.core { stroke: var(--icon-core); }
    .icon.ai { stroke: var(--icon-ai); }
    .icon.build { stroke: var(--icon-build); }
    .icon.client { stroke: var(--icon-client); }
    .lifeline { fill: none; stroke: var(--frame); stroke-width: 1; stroke-dasharray: 2 5; }
    .edge.reply { stroke-dasharray: 4 4; }
    .arrowhead.filled { fill: var(--connector); }
    .fragment { fill: none; stroke: var(--frame); stroke-width: 1.1; }
    .fragment-tag { fill: var(--canvas); stroke: var(--frame); stroke-width: 1.1; stroke-linejoin: round; }
    .fragment-op { font-size: 11px; font-weight: 500; letter-spacing: 0.88px; fill: var(--text-muted); }
    .operand { fill: none; stroke: var(--frame); stroke-width: 1.1; stroke-dasharray: 6 5; }
    .step { fill: var(--card); stroke: var(--connector); stroke-width: 1; }
    .step-text { font-size: 12px; font-weight: 400; fill: var(--text); }
    .refused-mark { fill: none; stroke: var(--signal-refusal); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .refused-patch { fill: none; stroke: var(--canvas); stroke-width: 6; }
    .refused-head { fill: none; stroke: var(--signal-refusal); stroke-width: 1; }
    .credit-line { opacity: 0.6; }
    .credit { font-size: 12px; font-weight: 400; fill: var(--connector); }
    .credit-mark { fill: var(--connector); }
    .credit-glyph { fill: none; stroke: var(--canvas); stroke-width: 5.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>
