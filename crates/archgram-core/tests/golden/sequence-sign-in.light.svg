    <g class="icon client" transform="translate(62.5 52.5)" stroke-width="1.7"><path d="M3.5 9l17 0"/><path d="M11.75 5.81V6M12 6c0 .14-.11.25-.25.25-.14 0-.25-.11-.25-.25 0-.14.11-.25.25-.25.14 0 .25.11.25.25z"/><path d="M8.75 5.81V6M9 6c0 .14-.11.25-.25.25-.14 0-.25-.11-.25-.25 0-.14.11-.25.25-.25.14 0 .25.11.25.25z"/><path d="M5.75 5.81V6M6 6c0 .14-.11.25-.25.25-.14 0-.25-.11-.25-.25 0-.14.11-.25.25-.25.14 0 .25.11.25.25z"/><path d="M3 12C3 7.76 3 5.64 4.32 4.32 5.64 3 7.76 3 12 3c4.24 0 6.36 0 7.68 1.32C21 5.64 21 7.76 21 12c0 4.24 0 6.36-1.32 7.68C18.36 21 16.24 21 12 21c-4.24 0-6.36 0-7.68-1.32C3 18.36 3 16.24 3 12z"/></g>
