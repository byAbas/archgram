[package]
name = "archgram-cli"
description = "The archgram command-line tool."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "archgram"
path = "src/main.rs"

[dependencies]
archgram-core = { path = "../archgram-core" }
archgram-icons = { path = "../archgram-icons" }
archgram-yaml = { path = "../archgram-yaml" }
# The still preview (docs/features/reader-check.md, #173): rendering only,
# with the embedded fonts; no system fonts, no image formats.
resvg = { version = "0.50", default-features = false, features = ["text"] }

[lints]
workspace = true
